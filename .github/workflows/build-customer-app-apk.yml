name: Build customer_app debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - 'frontend/customer_app/**'
      - '.github/workflows/build-customer-app-apk.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'frontend/customer_app/**'
      - '.github/workflows/build-customer-app-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/customer_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/customer_app/pubspec.yaml', 'frontend/customer_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer_app-debug-apk
          path: frontend/customer_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
